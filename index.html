<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="A daily habit tracker for faith, looks, body, mind and money. Runs in your browser. No account, no tracking.">
<title>Lifemaxing Daily</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230F1012'/%3E%3Crect x='8' y='8' width='6' height='6' fill='%23F5F5F6'/%3E%3Crect x='18' y='8' width='6' height='6' fill='%23F5F5F6'/%3E%3Crect x='8' y='18' width='6' height='6' fill='%23F5F5F6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@400..800&display=swap">
<style>
/* Layout: a ruled daily log. Phone: single column, text-only tab bar at the bottom. Desktop (880px+): fixed sidebar with wordmark, nav and level; main area splits into two columns (act / reflect). No cards, no shadows, no rounded pills: hairline rules, square controls, mono numerals. Colour appears only as the five pillar markers. */
:root {
  --bg: #E9EAEC;
  --panel: #F5F5F6;
  --fg: #0F1012;
  --muted: #5C5F66;
  --line: #C5C8CE;
  --ink: #0F1012;
  --ink-fg: #F5F5F6;
  --warn: #B3261E;
  --p-faith: #6D4AAE;
  --p-looks: #B8385E;
  --p-body: #2E7D4F;
  --p-mind: #2A69AD;
  --p-money: #1B7D7E;
  --font-body: "Schibsted Grotesk", "Helvetica Neue", Arial, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E0F11; --panel: #17191C; --fg: #ECECEA; --muted: #9A9CA3; --line: #2C2F34;
    --ink: #ECECEA; --ink-fg: #0E0F11; --warn: #FF8A80;
    --p-faith: #B79BF0; --p-looks: #F28BA9; --p-body: #6FCB93; --p-mind: #7DB4F2; --p-money: #5CCFCF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E0F11; --panel: #17191C; --fg: #ECECEA; --muted: #9A9CA3; --line: #2C2F34;
  --ink: #ECECEA; --ink-fg: #0E0F11; --warn: #FF8A80;
  --p-faith: #B79BF0; --p-looks: #F28BA9; --p-body: #6FCB93; --p-mind: #7DB4F2; --p-money: #5CCFCF;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-block: 20px 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
h1, h2, h3, p, ul { margin: 0; }
h1 { font-size: 34px; line-height: 1.05; font-weight: 800; letter-spacing: -.03em; }
h2 { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.kick { font-family: var(--font-mono); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.sm { font-size: 13px; }

.shell { max-width: 1160px; margin: 0 auto; display: block; }
#view { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
.cols { display: flex; flex-direction: column; gap: 28px; }
.ca, .cb { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
.sect { display: flex; flex-direction: column; gap: 12px; }
.sect > h2 { padding-bottom: 8px; border-bottom: 2px solid var(--ink); }

/* navigation */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bg); border-top: 1px solid var(--ink); display: grid; grid-template-columns: repeat(4, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
.tabs .brand, .tabs .glance, .tabs .keys { display: none; }
.tabs button { background: none; border: 0; border-top: 3px solid transparent; margin-top: -1px; padding: 14px 0 16px; min-height: 52px; cursor: pointer; color: var(--muted); font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; font-weight: 500; }
.tabs button[aria-current="page"] { color: var(--fg); border-top-color: var(--ink); font-weight: 600; }
.tabs .links { display: contents; }

/* page head */
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.head > div:first-child { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.dnav { display: flex; gap: 6px; align-items: center; flex: none; }
.nb { width: 40px; height: 40px; border: 1px solid var(--ink); background: transparent; cursor: pointer; font-size: 20px; line-height: 1; border-radius: 2px; }
.nb:hover:not(:disabled) { background: var(--ink); color: var(--ink-fg); }
.nb:disabled { opacity: .3; cursor: default; }
.tx { background: none; border: 0; padding: 8px 2px; min-height: 40px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }
.verse { font-size: 14px; color: var(--muted); max-width: 60ch; }
.verse b { font-family: var(--font-mono); font-weight: 500; font-size: 12px; color: var(--fg); letter-spacing: .04em; margin-right: 6px; text-transform: uppercase; }

/* tally */
.tallyrow { display: flex; align-items: center; gap: 14px; }
.tally { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; min-width: 0; }
.tally i { width: 12px; height: 12px; border: 1.5px solid var(--pc); border-radius: 1px; display: block; }
.tally i.d { background: var(--pc); }
.tally i.t { background: linear-gradient(135deg, var(--pc) 50%, transparent 50%); }
.tally i.c { box-shadow: 0 3px 0 -1.5px var(--fg); margin-bottom: 3px; }
.tallyrow .mono { font-size: 13px; flex: none; }

/* banner */
.note { border: 1px solid var(--ink); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; background: var(--panel); }
.note b { font-weight: 700; }
.note.warn { border-color: var(--warn); }
.note.warn b { color: var(--warn); }
.note .row { display: flex; gap: 8px; margin-top: 6px; }

/* buttons */
.btn { border: 1px solid var(--ink); background: transparent; border-radius: 2px; padding: 8px 16px; min-height: 44px; cursor: pointer; font-weight: 650; font-size: 14px; }
.btn:hover { background: var(--ink); color: var(--ink-fg); }
.btn.primary { background: var(--ink); color: var(--ink-fg); min-height: 52px; font-size: 16px; }
.btn.primary:hover { opacity: .88; }
.btn.danger { color: var(--warn); border-color: var(--warn); }
.btn.danger:hover { background: var(--warn); color: var(--bg); }
.btn.wide { width: 100%; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btns .btn { flex: 1 1 auto; }

/* next up */
.next { border-top: 3px solid var(--ink); border-bottom: 1px solid var(--line); padding: 16px 0 20px; display: flex; flex-direction: column; gap: 14px; }
.next .meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.mk { width: 12px; height: 12px; background: var(--pc); display: inline-block; flex: none; border-radius: 1px; }
.next h2.t { font-size: 32px; line-height: 1.1; font-weight: 800; letter-spacing: -.025em; text-transform: none; padding: 0; border: 0; overflow-wrap: anywhere; }
.cue { color: var(--muted); }
.cue b { color: var(--fg); font-weight: 600; }
.tag { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; border: 1px solid currentColor; padding: 1px 5px; border-radius: 1px; font-weight: 500; }

/* mode */
.modebar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.seg { display: inline-flex; gap: 18px; }
.seg button { border: 0; border-bottom: 2px solid transparent; background: none; padding: 8px 0; min-height: 40px; cursor: pointer; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { color: var(--fg); border-bottom-color: var(--ink); }

/* routines */
.slot { display: flex; flex-direction: column; }
.slot-h { display: flex; align-items: baseline; gap: 10px; padding-bottom: 8px; border-bottom: 2px solid var(--ink); }
.slot-h .c { margin-left: auto; font-family: var(--font-mono); font-size: 13px; }
.now { font-family: var(--font-mono); font-size: 11px; background: var(--ink); color: var(--ink-fg); padding: 1px 6px; border-radius: 1px; letter-spacing: .06em; }
.rt { display: flex; align-items: center; border-bottom: 1px solid var(--line); }
.rt .main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; text-align: left; background: none; border: 0; padding: 12px 0; min-height: 52px; cursor: pointer; }
.chk { flex: none; width: 22px; height: 22px; border: 2px solid var(--pc); border-radius: 2px; display: grid; place-items: center; position: relative; background: transparent; padding: 0; }
.chk svg { width: 14px; height: 14px; stroke: var(--bg); opacity: 0; }
.main[aria-checked="true"] .chk { background: var(--pc); }
.main[aria-checked="true"] .chk svg { opacity: 1; }
.main[data-tiny="1"] .chk { background: linear-gradient(135deg, var(--pc) 50%, transparent 50%); }
.main[data-tiny="1"] .chk svg { display: none; }
.rt .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.main[aria-checked="true"] .nm { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.rt .mt { flex: none; display: flex; gap: 8px; align-items: center; font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.mt .core { color: var(--fg); border: 1px solid var(--fg); padding: 0 4px; border-radius: 1px; }
.info { flex: none; width: 40px; height: 40px; border: 0; background: none; color: var(--muted); cursor: pointer; font-family: var(--font-mono); font-size: 18px; }
.info:hover { color: var(--fg); }
.det { padding: 2px 0 14px 36px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); align-items: flex-start; }
.pop .chk { animation: pop .3s ease-out; }
@keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }

/* forms */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .lbl { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.input { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 2px; padding: 10px 12px; min-height: 44px; }
.input:focus { border-color: var(--ink); outline: 0; box-shadow: 0 0 0 1px var(--ink); }
.input::placeholder { color: var(--muted); opacity: .8; }
textarea.input { resize: vertical; min-height: 72px; }
select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--fg) 50%), linear-gradient(135deg, var(--fg) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.prow { display: flex; align-items: center; gap: 12px; }
.prow .chk { --pc: var(--ink); cursor: pointer; }
.prow .chk[aria-checked="true"] { background: var(--ink); }
.prow .chk[aria-checked="true"] svg { opacity: 1; stroke: var(--ink-fg); }
.prow .input.done { color: var(--muted); text-decoration: line-through; }
details.ci > summary { list-style: none; cursor: pointer; display: flex; align-items: baseline; gap: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--ink); min-height: 36px; }
details.ci > summary::-webkit-details-marker { display: none; }
details.ci > summary::after { content: "+"; margin-left: auto; font-family: var(--font-mono); font-size: 18px; line-height: 1; }
details.ci[open] > summary::after { content: "\2212"; }
details.ci > .stack { padding-top: 14px; }
.mood { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.mood button { min-height: 44px; border: 1px solid var(--line); background: var(--panel); border-radius: 2px; cursor: pointer; font-family: var(--font-mono); font-weight: 600; font-size: 15px; }
.mood button[aria-pressed="true"] { background: var(--ink); color: var(--ink-fg); border-color: var(--ink); }
.moodkey { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-transform: uppercase; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* journey */
.lv { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.lv .num { font-family: var(--font-mono); font-size: 56px; line-height: 1; font-weight: 500; letter-spacing: -.04em; }
.lv .ttl { font-size: 20px; font-weight: 700; }
.lv .xp { margin-left: auto; font-family: var(--font-mono); font-size: 13px; }
.xpbar { height: 6px; background: var(--line); }
.xpbar i { display: block; height: 100%; background: var(--ink); transition: width .5s; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 2px solid var(--ink); border-bottom: 1px solid var(--line); }
.fact { padding: 12px 0; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fact + .fact { padding-left: 14px; border-left: 1px solid var(--line); }
.fact b { font-family: var(--font-mono); font-size: 30px; font-weight: 500; line-height: 1.1; letter-spacing: -.03em; }
.fact span { font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.irow { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.irow .t { display: flex; align-items: baseline; gap: 10px; }
.irow .t b { font-weight: 600; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.irow .v { font-family: var(--font-mono); font-size: 12px; color: var(--muted); flex: none; }
.wk { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.wk i { height: 6px; background: var(--line); }
.wk i.on { background: var(--pc); }
.heat-h, .heat { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.heat-h, .heat, .legend { max-width: 460px; }
.heat-h { font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-align: center; text-transform: uppercase; }
.cell { aspect-ratio: 1 / 1; max-width: 100%; border: 1px solid var(--line); background: var(--panel); cursor: pointer; padding: 0; font-family: var(--font-mono); font-size: 11px; color: var(--muted); border-radius: 1px; }
.cell:hover { border-color: var(--ink); }
.cell.kept { background: var(--ink); border-color: var(--ink); color: var(--ink-fg); font-weight: 600; }
.cell.part { background: var(--line); color: var(--fg); }
.cell.rest { border: 1px dashed var(--ink); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-transform: uppercase; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; background: var(--line); }
.legend .k::before { background: var(--ink); }
.legend .r::before { background: transparent; border: 1px dashed var(--ink); }
.trends { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.tr { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tr svg { width: 100%; height: 40px; color: var(--fg); }
.tr b { font-family: var(--font-mono); font-size: 17px; font-weight: 500; }
.ms { display: flex; align-items: baseline; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.ms .m { width: 10px; height: 10px; flex: none; border: 1px solid var(--fg); }
.ms.on .m { background: var(--ink); }
.ms b { font-weight: 600; }
.ms span { margin-left: auto; font-size: 13px; color: var(--muted); text-align: right; }
.ms:not(.on) b { color: var(--muted); font-weight: 500; }

/* plan */
.ph2 { display: flex; align-items: baseline; gap: 10px; padding-bottom: 8px; border-bottom: 2px solid var(--ink); }
.ph2 .c { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.ph2 .mk { align-self: center; }
.prow2 { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--line); min-height: 52px; }
.prow2 .t { flex: 1; min-width: 0; padding: 10px 0; overflow-wrap: anywhere; }
.prow2 .t small { display: block; color: var(--muted); font-size: 12px; }
.ibtn { min-width: 44px; height: 40px; padding: 0 6px; border: 0; background: none; cursor: pointer; color: var(--muted); font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
.ibtn:hover { color: var(--fg); text-decoration: underline; }
.ibtn.on { color: var(--fg); font-weight: 600; }
.ibtn.on::before { content: "\25A0\00a0"; font-size: 8px; vertical-align: 1px; }
.editor { border: 1px solid var(--ink); background: var(--panel); padding: 16px; display: flex; flex-direction: column; gap: 12px; margin-block: 10px; }
.chkline { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.chkline input { width: 18px; height: 18px; accent-color: var(--ink); }
.lib { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); padding: 8px 0; }
.lib .t { flex: 1; min-width: 0; }
.lib small { display: block; color: var(--muted); font-size: 12px; }

/* me */
.entry { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.entry p { font-size: 14px; }
.entry p b { font-family: var(--font-mono); color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; margin-right: 8px; }
.why { font-size: 22px; line-height: 1.3; font-weight: 600; letter-spacing: -.01em; }
.how { display: flex; flex-direction: column; gap: 0; padding: 0; list-style: none; }
.how li { padding: 10px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.how b { font-weight: 650; }

/* toast */
#toast { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(68px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--ink-fg); padding: 12px 16px; font-size: 14px; font-weight: 550; opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .2s, transform .2s; z-index: 30; border-radius: 2px; max-width: 440px; }
#toast.on { opacity: 1; transform: none; }

/* desktop */
@media (min-width: 880px) {
  body { padding-block: 40px 56px; }
  .shell { display: grid; grid-template-columns: 208px minmax(0, 1fr); column-gap: 56px; align-items: start; }
  .tabs { position: sticky; top: 40px; left: auto; right: auto; bottom: auto; display: flex; flex-direction: column; gap: 24px; background: transparent; border: 0; padding: 0; z-index: 1; }
  .tabs .brand { display: block; font-size: 20px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; padding-bottom: 14px; border-bottom: 2px solid var(--ink); }
  .tabs .brand span { display: block; font-family: var(--font-mono); font-size: 11px; font-weight: 400; letter-spacing: .04em; color: var(--muted); text-transform: uppercase; margin-top: 6px; }
  .tabs .links { display: flex; flex-direction: column; }
  .tabs button { text-align: left; border-top: 0; border-left: 3px solid transparent; margin: 0; padding: 10px 0 10px 12px; min-height: 0; font-size: 13px; }
  .tabs button[aria-current="page"] { border-left-color: var(--ink); }
  .tabs .glance { display: flex; flex-direction: column; gap: 8px; padding-top: 14px; border-top: 1px solid var(--line); font-family: var(--font-mono); font-size: 12px; }
  .tabs .glance div { display: flex; justify-content: space-between; gap: 8px; }
  .tabs .glance span { color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .tabs .keys { display: block; font-family: var(--font-mono); font-size: 11px; color: var(--muted); line-height: 1.7; }
  #view { gap: 36px; }
  h1 { font-size: 46px; }
  .cols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 56px; align-items: start; }
  .cb { position: relative; }
  #toast { left: 50%; right: auto; bottom: 28px; transform: translate(-50%, 8px); min-width: 260px; text-align: center; }
  #toast.on { transform: translate(-50%, 0); }
}
@media (min-width: 880px) and (max-width: 1099px) {
  .cols { grid-template-columns: 1fr; gap: 36px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="shell">
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <main class="app"><div id="view"></div></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="imp" accept="application/json,.json" hidden>

<script>
(function () {
  "use strict";
  var KEY = "lifemaxing-v3";

  }
  function goTab(t) { if (location.hash !== "#" + t) location.hash = t; else render(); window.scrollTo(0, 0); }
  function draftFrom(t) { return t ? { name: t.name, pillar: t.pillar, slot: t.slot, core: t.core, cue: t.cue || "", tiny: t.tiny || "" } : { name: "", pillar: "faith", slot: "Anytime", core: false, cue: "", tiny: "" }; }
  function cleanNote(day) {
    var n = state.notes[day]; if (!n) return;
    var t = (n.t || []).some(function (x) { return x && (x.x || x.d); });
    if (!n.i && !n.w && !n.g && !n.l && !t) delete state.notes[day];
  }
  function cleanVit(day) {
    var v = state.vitals[day]; if (!v) return;
    if (!v.m && v.s == null && v.w == null) delete state.vitals[day];
  }
  function noteFor(day) { return state.notes[day] || (state.notes[day] = {}); }
  function goDay(n) { viewDay = shift(viewDay, n); expanded = null; snoozed = []; render(); }

  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]"); if (!el) return;
    var a = el.dataset.act, id = el.dataset.id;
    switch (a) {
      case "tab": goTab(el.dataset.tab); break;
      case "prev": goDay(-1); break;
      case "next": if (viewDay < todayKey) goDay(1); break;
      case "today": viewDay = todayKey; expanded = null; render(); break;
      case "goday": viewDay = el.dataset.day; expanded = null; snoozed = []; goTab("today"); break;
      case "seen": state.seen = true; touch(); render(); break;
      case "done": setVal(id, 2); break;
      case "tiny": setVal(id, 1); break;
      case "toggle": setVal(id, val(viewDay, id) ? 0 : 2); break;
      case "snooze": snoozed.push(id); render(); break;
      case "info": expanded = expanded === id ? null : id; render(); break;
      case "mode-full": delete state.low[viewDay]; touch(); render(); break;
      case "mode-low": state.low[viewDay] = 1; touch(); render(); toast("Low energy day. Core habits only."); break;
      case "full": delete state.low[viewDay]; touch(); render(); break;
      case "rest":
        if (isRest(viewDay)) delete state.rest[viewDay]; else state.rest[viewDay] = 1;
        touch(); render(); if (isRest(viewDay)) toast("Rest day. Your streak is safe."); break;
      case "prio": {
        var i = +el.dataset.i, n = state.notes[viewDay] || (state.notes[viewDay] = {});
        if (!Array.isArray(n.t)) n.t = [];
        while (n.t.length < 3) n.t.push({ x: "", d: false });
        n.t[i].d = !n.t[i].d; cleanNote(viewDay); touch(); render(); break;
      }
      case "mood": {
        var m = +el.dataset.m, v = state.vitals[viewDay] || (state.vitals[viewDay] = {});
        if (v.m === m) delete v.m; else v.m = m;
        cleanVit(viewDay); touch(); render(); break;
      }
      case "new-task": editId = "new"; draft = draftFrom(null); render(); break;
      case "edit-task": editId = id; draft = draftFrom(taskById(id)); render(); break;
      case "cancel-edit": editId = null; draft = null; render(); break;
      case "save-task": {
        var nm = (draft.name || "").trim();
        if (!nm) { toast("Give the habit a name."); var f = $("#d-name"); if (f) f.focus(); break; }
        if (editId === "new") state.tasks.push({ id: "u" + Date.now().toString(36), pillar: draft.pillar, name: nm, slot: draft.slot, core: !!draft.core, cue: draft.cue.trim(), tiny: draft.tiny.trim() });
        else { var t = taskById(editId); if (t) { t.pillar = draft.pillar; t.name = nm; t.slot = draft.slot; t.core = !!draft.core; t.cue = draft.cue.trim(); t.tiny = draft.tiny.trim(); } }
        editId = null; draft = null; touch(); render(); toast("Saved."); break;
      }
      case "del-task":
        state.tasks = state.tasks.filter(function (t) { return t.id !== id; });
        editId = null; draft = null; touch(); render(); toast("Habit removed. History is kept."); break;
      case "core": { var tk = taskById(id); if (tk) { tk.core = !tk.core; touch(); render(); } break; }
      case "lib": libOpen = !libOpen; render(); break;
      case "add-lib": {
        var l = LIBRARY[+el.dataset.i]; if (!l) break;
        state.tasks.push({ id: "u" + Date.now().toString(36), pillar: l[0], name: l[1], slot: l[2], core: false, cue: l[3], tiny: l[4] });
        touch(); render(); toast("Added: " + l[1]); break;
      }
      case "exp-json": saveFile("lifemaxing-backup-" + todayKey + ".json", JSON.stringify(state, null, 2)); break;
      case "exp-csv": exportCsv(); break;
      case "import": $("#imp").click(); break;
      case "reset": confirmReset = true; render(); break;
      case "reset-no": confirmReset = false; render(); break;
      case "reset-yes":
        state = defaults(); confirmReset = false; viewDay = todayKey; touch(); render(); toast("Everything reset."); break;
    }
  });

  document.addEventListener("input", function (e) {
    var el = e.target; var f = el.dataset && el.dataset.f; if (!f) return;
    var day = viewDay, v = el.value;
    if (f === "intent") { noteFor(day).i = v; cleanNote(day); saveSoon(); }
    else if (f === "win") { noteFor(day).w = v; cleanNote(day); saveSoon(); }
    else if (f === "grat") { noteFor(day).g = v; cleanNote(day); saveSoon(); }
    else if (f === "less") { noteFor(day).l = v; cleanNote(day); saveSoon(); }
    else if (f === "prio") {
      var n = noteFor(day), i = +el.dataset.i;
      if (!Array.isArray(n.t)) n.t = [];
      while (n.t.length < 3) n.t.push({ x: "", d: false });
      n.t[i].x = v; cleanNote(day); saveSoon();
    }
    else if (f === "sleep" || f === "weight") {
      var vt = state.vitals[day] || (state.vitals[day] = {}), key = f === "sleep" ? "s" : "w";
      if (v === "" || isNaN(+v)) delete vt[key]; else vt[key] = +v;
      cleanVit(day); saveSoon();
    }
    else if (f === "why") { state.why = v; saveSoon(); }
    else if (f === "ident") { state.ident[el.dataset.p] = v; saveSoon(); }
    else if (f === "wa" || f === "wb" || f === "wf") {
      var wk = weekStart(todayKey), r = state.weekly[wk] || (state.weekly[wk] = {});
      r[f.charAt(1)] = v;
      if (!r.a && !r.b && !r.f) delete state.weekly[wk];
      saveSoon();
    }
    else if (f.indexOf("d-") === 0 && draft) {
      var key2 = f.slice(2);
      draft[key2] = key2 === "core" ? el.checked : v;
    }
  });
  document.addEventListener("change", function (e) {
    var el = e.target; var f = el.dataset && el.dataset.f;
    if (f && f.indexOf("d-") === 0 && draft) { var k = f.slice(2); draft[k] = k === "core" ? el.checked : el.value; }
  });

  // keyboard shortcuts (desktop)
  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = e.target && e.target.tagName;
    if (/INPUT|TEXTAREA|SELECT/.test(tag) || (e.target && e.target.isContentEditable)) return;
    var i = "1234".indexOf(e.key);
    if (i > -1 && e.key.length === 1) { goTab(TABS[i]); return; }
    if (curTab() !== "today") return;
    if (e.key === "ArrowLeft") { goDay(-1); }
    else if (e.key === "ArrowRight") { if (viewDay < todayKey) goDay(1); }
    else if (e.key === "d" || e.key === "D") { var b = document.querySelector('.next [data-act="done"]'); if (b) setVal(b.dataset.id, 2); }
  });

  window.addEventListener("hashchange", function () { render(); window.scrollTo(0, 0); });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible") return;
    var k = dkey(new Date());
    if (k !== todayKey) { var was = viewDay === todayKey; todayKey = k; if (was) viewDay = k; memo = {}; }
    if (!(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) render();
  });

  /* ---------- export / import ---------- */
  function blobSave(name, data) {
    var type = /\.csv$/.test(name) ? "text/csv" : "application/json";
    var u = URL.createObjectURL(new Blob([data], { type: type + ";charset=utf-8" }));
    var a = document.createElement("a"); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(u); }, 1500); toast("Saved " + name);
  }
  function saveFile(name, data) {
    if (downloads) {
      downloads.save({ filename: name, data: data }).then(function () { toast("Saved " + name); },
        function (err) { if (err && err.code !== "declined") toast("Could not save that file here."); });
    } else if (!inArtifact) blobSave(name, data);
  }
  function exportCsv() {
    var cols2 = ["date", "kept", "done", "total"].concat(PILLARS.map(function (p) { return p.id + "_done"; }), ["mood", "sleep_h", "weight_kg", "intention", "win", "grateful", "lesson"]);
    var keys = {};
    Object.keys(state.done).concat(Object.keys(state.notes), Object.keys(state.vitals)).forEach(function (k) { keys[k] = 1; });
    function q(s) { s = String(s == null ? "" : s); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
    var lines = [cols2.join(",")];
    Object.keys(keys).sort().forEach(function (k) {
      var s = dayStats(k), v = state.vitals[k] || {}, n = state.notes[k] || {};
      var row = [k, s.kept ? 1 : 0, s.done, s.total].concat(PILLARS.map(function (p) {
        return state.tasks.filter(function (t) { return t.pillar === p.id && val(k, t.id); }).length;
      }), [v.m, v.s, v.w, n.i, n.w, n.g, n.l]);
      lines.push(row.map(q).join(","));
    });
    saveFile("lifemaxing-history.csv", lines.join("\n"));
  }
  $("#imp").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(String(r.result));
        if (!d || typeof d !== "object" || !Array.isArray(d.tasks)) throw new Error("bad");
        state = normalize(d); touch(); render(); toast("Backup imported.");
      } catch (err) { toast("That file is not a Lifemaxing backup."); }
      e.target.value = "";
    };
    r.readAsText(f);
  });
  if (inArtifact) {
    window.claude.use("downloads").then(function (d) { if (d) { downloads = d; if (curTab() === "me") render(); } }).catch(function () {});
  }

  render();

  /* ---------- account storage (only when hosted as a Claude artifact) ---------- */
  (function connect() {
    if (!inArtifact) return;
    Promise.all([window.claude.use("db"), window.claude.use("user")]).then(function (r) {
      var db = r[0], user = r[1];
      if (!db || !user) return null;
      return user.id().then(function (uid) {
        if (!uid) return;
        ref = db.collection("data/users/" + uid).doc("tracker");
        ref.onSnapshot(function (snap) {
          if (snap.metadata.hasPendingWrites) return;
          if (snap.exists) {
            var remote = normalize(snap.data());
            if (remote.updatedAt > state.updatedAt) {
              state = remote; ver++; memo = {}; persistLocal(); setNote("Saved to your account.");
              if (!(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) render();
            } else if (remote.updatedAt < state.updatedAt && !snap.metadata.fromCache) {
              schedule();
            } else if (!inflight) {
              setNote("Saved to your account.");
            }
          } else if (!snap.metadata.fromCache) {
            if (!state.updatedAt) state.updatedAt = Date.now();
            persistLocal(); schedule();
          }
        }, function () { setNote("Saved on this device only."); });
      });
    }).catch(function () {});
  })();
})();
</script>
</body>
